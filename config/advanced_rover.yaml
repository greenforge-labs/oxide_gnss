# oxide_gnss configuration: Advanced RTK Rover
#
# This example demonstrates advanced configuration options:
# - Mode-based config with feature flags
# - Custom GNSS constellation/signal settings
# - Additional UBX message overrides
# - Custom measurement rate
#
# The mode provides sensible defaults, but you can customize:
# - device.ublox.signals: Enable/disable GNSS constellations
# - device.ublox.messages: Add extra UBX messages or change rates
# - device.ublox.rate: Change measurement/navigation rate

mode: rover_ntrip

features:
  high_precision: true    # Use HP position data in ~/fix
  integrity: true         # Enable ~/integrity and ~/operational topics
  satellites: false        # Enable ~/satellites topic (higher bandwidth)

device:
  port: "/dev/gnss_f9p_rover"
  baud_rate: 460800
  frame: ENU

  navigation:
    rate_hz: 10
    min_satellites: 4
    max_hdop: 5.0

  # Advanced u-blox configuration (optional - overrides mode defaults)
  ublox:
    # Device family (for validation warnings)
    family: "F9P"

    # Measurement rate configuration
    rate:
      measurement_ms: 100   # 10 Hz (100ms per measurement)
      nav_ratio: 1          # One nav solution per measurement

    # Navigation engine configuration
    nav_spg:
      # Dynamic platform model - optimize filter for your application
      # Options: portable, stationary, pedestrian, automotive, sea,
      #          airborne_light, airborne_medium, airborne_high,
      #          wrist, bike, mower, escooter, robot
      dynamic_model: robot      # Generic robot platform

      # Elevation mask - reject satellites below this angle (degrees)
      # Helps reduce multipath in challenging environments
      elevation_mask: 10

      # PDOP mask - reject solutions with poor geometry
      # pdop_mask: 6.0

    # Timepulse (PPS) configuration - for sensor synchronization
    # Outputs precise timing pulse on TIMEPULSE pin
    timepulse:
      enabled: true
      frequency_hz: 1           # 1 PPS output
      pulse_length_us: 100000   # 100ms pulse width
      polarity: rising          # Rising edge at GPS second
      time_grid: gps            # Align to GPS time
      align_to_tow: true        # Align to top of second

    # Time mark (EXTINT) - external event timestamping
    # Enables TIM-TM2 message for precise GNSS-synchronized timestamps
    # when signal detected on EXTINT pin (e.g., camera shutter feedback)
    time_mark:
      enabled: true

    # GNSS constellation configuration
    # Uncomment to customize which constellations/signals are used
    signals:
      gps:
        enabled: true
        l1: true            # L1C/A signal
        l2: true            # L2C signal (for dual-frequency)

      glonass:
        enabled: true
        l1: true            # L1OF signal
        l2: true            # L2OF signal

      galileo:
        enabled: false
        l1: false            # E1 signal
        l2: false            # E5b signal

      beidou:
        enabled: true
        b1: true            # B1 signal
        b2: true            # B2 signal

      # SBAS (e.g., WAAS, EGNOS) - optional augmentation
      sbas:
        enabled: false      # Disable for pure RTK operation

      # QZSS - useful in Asia-Pacific region
      qzss:
        enabled: false
        l1ca: false
        l1s: false
        l2c: false

    # Additional UBX messages (merged with mode defaults)
    # Use this to add messages not included in the mode preset
    # or to change output rates (rate 0 = disabled)
    # messages:
    #   usb:
        # Example: Add covariance output (F9R/F9H only, not F9P)
        # NAV_COV: 1

        # Example: Increase satellite info rate (default is 1)
        # NAV_SAT: 5

        # Example: Add event logging for debugging
        # SEC_SIGLOG: 1

        # Example: Disable a message that mode enables
        # MON_COMMS: 0

# Integrity monitoring thresholds (optional - these are the defaults)
# Customize based on your application's safety requirements
integrity:
  thresholds:
    # Critical checks - below these triggers CRITICAL level
    min_satellites_critical: 4    # Minimum satellites for any fix

    # Degraded checks - below/above these triggers DEGRADED level
    min_satellites_high: 6        # Preferred minimum satellites
    max_h_accuracy_m: 0.10        # Max horizontal accuracy (10cm)
    max_v_accuracy_m: 0.15        # Max vertical accuracy (15cm)
    max_pdop: 3.0                 # Max position DOP
    max_correction_age_s: 10.0    # Max RTK correction age (device-reported)
    min_cno_degraded: 25          # Min C/N0 for weakest satellite (dB-Hz)
    min_mean_cno_degraded: 35.0   # Min mean C/N0 across satellites (dB-Hz)

    # Staleness check - exceeding this triggers FAILED level
    max_pvt_age_s: 2.0            # Max time without PVT data

    # Operational threshold:
    # 0 = only OK is operational (strictest)
    # 1 = OK or DEGRADED is operational (default)
    # 2 = OK/DEGRADED/CRITICAL is operational (permissive)
    operational_threshold: 1

ntrip:
  host: "ntrip.data.gnss.ga.gov.au"
  # insecure (port 2101)
  # port: 2101
  # use_https: false

  # secure (port 443)
  port: 443
  use_https: true
  
  mountpoint: "SWTC00AUS0"
  username: "${NTRIP_USERNAME}"
  password: "${NTRIP_PASSWORD}"
  send_gga: true
  gga_interval_secs: 60
