# oxide_gnss configuration: RTK Rover with Integrity Monitoring
#
# RTK rover with NTRIP corrections and full integrity monitoring enabled.
# Use this for safety-critical applications requiring go/no-go decisions.

mode: rover_ntrip

features:
  high_precision: true
  integrity: true         # Enable ~/integrity and ~/operational topics
  satellites: true        # Enable ~/satellites for monitoring

ros:
  rates:
    diagnostics_hz: 1.0
    integrity_hz: 1.0

device:
  # Serial port - use udev symlink for stability
  port: "/dev/gnss_f9p_rover"
  baud_rate: 460800
  frame: ENU

  navigation:
    rate_hz: 10
    min_satellites: 4
    max_hdop: 5.0
    max_pdop: 10.0

  reconnect:
    enabled: true
    initial_delay_secs: 1
    max_delay_secs: 30
    max_attempts: 0       # Unlimited retries for safety-critical operation

  # u-blox configuration overrides (mode handles ports/protocols automatically)
  ublox:
    family: "F9P"

    rate:
      measurement_ms: 100   # 10 Hz
      nav_ratio: 1

    # Navigation engine configuration
    nav_spg:
      dynamic_model: automotive   # Ground vehicle dynamics

# =============================================================================
# NTRIP Configuration
# =============================================================================
# RTK corrections for centimeter-level accuracy.
# Credentials via environment variables for security.
ntrip:
  host: "ntrip.data.gnss.ga.gov.au"
  port: 2101
  use_https: false
  mountpoint: "ALIC00AUS0"    # Change to nearest base station

  # Authentication - use environment variables
  username: "${NTRIP_USERNAME}"
  password: "${NTRIP_PASSWORD}"

  # GGA position reporting (required by most VRS networks)
  send_gga: true
  gga_interval_secs: 10

  connection:
    timeout_secs: 10
    reconnect: true
    initial_delay_secs: 1
    max_delay_secs: 60
    backoff_reset_secs: 3600
