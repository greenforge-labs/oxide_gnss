# oxide_gnss configuration: Moving Base Rover
#
# Rover in a moving base + rover pair.
# Receives RTCM corrections from the moving base via UART2.
# Outputs absolute position and baseline (relative) position.

mode: moving_base_rover

features:
  high_precision: true
  integrity: true
  heading: true           # Get heading from baseline vector

device:
  port: "/dev/gnss_f9p_rover"
  baud_rate: 460800
  frame: ENU

  navigation:
    rate_hz: 5            # Match base rate
    min_satellites: 4
    max_hdop: 5.0
    max_pdop: 10.0

  reconnect:
    enabled: true
    initial_delay_secs: 1
    max_delay_secs: 30
    max_attempts: 0       # 0 = unlimited
    backoff_reset_secs: 300

  # u-blox configuration overrides (mode handles ports/protocols automatically)
  ublox:
    family: "F9P"

    rate:
      measurement_ms: 200   # 5 Hz (must match moving_base.yaml)
      nav_ratio: 1

    # Navigation engine configuration
    nav_spg:
      dynamic_model: automotive   # Vehicle-mounted rover

    # Force CFG-TMODE3 = Disabled for symmetry with moving_base.yaml (a rover
    # F9P that previously played static_base would be stuck in Time Only
    # otherwise).
    base_position:
      mode: disabled

    # UART2 baudrate: must match moving_base.yaml (460800, per AppNote).
    ports:
      uart2:
        baudrate: 460800

    # GNSS constellation configuration (should match base)
    signals:
      gps:
        enabled: true
        l1: true
        l2: true

      glonass:
        enabled: true
        l1: true
        l2: true

      galileo:
        enabled: false
        l1: false
        l2: false

      beidou:
        enabled: true
        b1: true
        b2: true

      sbas:
        enabled: false

      qzss:
        enabled: false

# ROS topic publish rates
ros:
  rates:
    diagnostics_hz: 1.0
    integrity_hz: 1.0

# Integrity monitoring thresholds
integrity:
  thresholds:
    min_satellites_critical: 4
    min_satellites_high: 6
    max_h_accuracy_m: 0.10
    max_v_accuracy_m: 0.15
    max_pdop: 3.0
    max_correction_age_s: 10.0
    min_cno_degraded: 25
    min_mean_cno_degraded: 35.0
    max_pvt_age_s: 2.0
    operational_threshold: 1

# No NTRIP - corrections come from the moving base via UART2
