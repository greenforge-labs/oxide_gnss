# oxide_gnss configuration: Moving Base
#
# Moving base in a moving base + rover pair.
# Outputs RTCM corrections to the rover via UART2.
# Optionally receives NTRIP corrections for absolute position.

mode: moving_base

features:
  high_precision: true
  integrity: true

device:
  port: "/dev/gnss_f9p_base"
  baud_rate: 460800
  frame: ENU

  navigation:
    rate_hz: 5            # 5 Hz for moving base
    min_satellites: 4
    max_hdop: 5.0
    max_pdop: 10.0

  reconnect:
    enabled: true
    initial_delay_secs: 1
    max_delay_secs: 30
    max_attempts: 0       # 0 = unlimited
    backoff_reset_secs: 300

  # u-blox configuration overrides (mode handles ports/protocols automatically)
  ublox:
    family: "F9P"

    rate:
      measurement_ms: 200   # 5 Hz (matches navigation rate_hz)
      nav_ratio: 1

    # Navigation engine configuration
    nav_spg:
      dynamic_model: automotive   # Vehicle-mounted base

    # UART2 baudrate for RTCM output to rover
    ports:
      uart2:
        baudrate: 460800

    # GNSS constellation configuration
    signals:
      gps:
        enabled: true
        l1: true
        l2: true

      glonass:
        enabled: true
        l1: true
        l2: true

      galileo:
        enabled: false
        l1: false
        l2: false

      beidou:
        enabled: true
        b1: true
        b2: true

      sbas:
        enabled: false

      qzss:
        enabled: false

# ROS topic publish rates
ros:
  rates:
    diagnostics_hz: 1.0
    integrity_hz: 1.0

# Integrity monitoring thresholds
integrity:
  thresholds:
    min_satellites_critical: 4
    min_satellites_high: 6
    max_h_accuracy_m: 0.10
    max_v_accuracy_m: 0.15
    max_pdop: 3.0
    max_correction_age_s: 10.0
    min_cno_degraded: 25
    min_mean_cno_degraded: 35.0
    max_pvt_age_s: 2.0
    operational_threshold: 1

# Optional: NTRIP for absolute position (comment out if not needed)
ntrip:
  host: "ntrip.data.gnss.ga.gov.au"
  port: 2101
  use_https: false
  # tls_skip_verify: false
  # ntrip_version: auto
  mountpoint: "SFLD00AUS0"
  username: "${NTRIP_USERNAME}"
  password: "${NTRIP_PASSWORD}"
  send_gga: true
  gga_interval_secs: 10

  connection:
    timeout_secs: 10
    read_timeout_secs: 30
    reconnect: true
    initial_delay_secs: 1
    max_delay_secs: 60
    backoff_reset_secs: 3600
