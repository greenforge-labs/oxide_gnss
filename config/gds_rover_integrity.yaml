# oxide_gnss configuration: RTK Rover with Integrity Monitoring
#
# RTK rover with NTRIP corrections and full integrity monitoring enabled.
# Use this for safety-critical applications requiring go/no-go decisions.

mode: rover_ntrip

features:
  high_precision: true
  integrity: true         # Enable ~/integrity and ~/operational topics
  satellites: false        # Enable ~/satellites for monitoring

ros:
  rates:
    diagnostics_hz: 1.0
    integrity_hz: 1.0

device:
  # Serial port - use udev symlink for stability
  port: "/dev/gnss_f9p_base"
  baud_rate: 460800
  frame: ENU

  navigation:
    rate_hz: 10
    min_satellites: 4
    max_hdop: 5.0
    max_pdop: 10.0

  reconnect:
    enabled: true
    initial_delay_secs: 1
    max_delay_secs: 30
    max_attempts: 0       # Unlimited retries for safety-critical operation

  # u-blox configuration overrides (mode handles ports/protocols automatically)
  ublox:
    family: "F9P"

    rate:
      measurement_ms: 100   # 10 Hz
      nav_ratio: 1

    # GNSS constellation configuration
    # Uncomment to customize which constellations/signals are used
    signals:
      gps:
        enabled: true
        l1: true            # L1C/A signal
        l2: true            # L2C signal (for dual-frequency)

      glonass:
        enabled: true
        l1: true            # L1OF signal
        l2: true            # L2OF signal

      galileo:
        enabled: false
        l1: false            # E1 signal
        l2: false            # E5b signal

      beidou:
        enabled: true
        b1: true            # B1 signal
        b2: true            # B2 signal

      # SBAS (e.g., WAAS, EGNOS) - optional augmentation
      sbas:
        enabled: false      # Disable for pure RTK operation

# Integrity monitoring thresholds (optional - these are the defaults)
# Customize based on your application's safety requirements
integrity:
  thresholds:
    # Critical checks - below these triggers CRITICAL level
    min_satellites_critical: 4    # Minimum satellites for any fix

    # Degraded checks - below/above these triggers DEGRADED level
    min_satellites_high: 6        # Preferred minimum satellites
    max_h_accuracy_m: 0.20        # Max horizontal accuracy (10cm)
    max_v_accuracy_m: 0.25        # Max vertical accuracy (15cm)
    max_pdop: 3.0                 # Max position DOP
    max_correction_age_s: 10.0    # Max RTK correction age (device-reported)
    min_cno_degraded: 25          # Min C/N0 for weakest satellite (dB-Hz)
    min_mean_cno_degraded: 35.0   # Min mean C/N0 across satellites (dB-Hz)
    max_tmir_per_epoch: 6.0       # 6% MI/epoch (device default is typically 5e0 = 5%)

    # Staleness check - exceeding this triggers FAILED level
    max_pvt_age_s: 2.0            # Max time without PVT data

    # Operational threshold:
    # 0 = only OK is operational (strictest)
    # 1 = OK or DEGRADED is operational (default)
    # 2 = OK/DEGRADED/CRITICAL is operational (permissive)
    operational_threshold: 1

# =============================================================================
# NTRIP Configuration
# =============================================================================
# RTK corrections for centimeter-level accuracy.
# Credentials via environment variables for security.
ntrip:
  host: "ntrip.data.gnss.ga.gov.au"
  port: 443
  use_https: true
  mountpoint: "SWTC00AUS0"    # Change to nearest base station

  # Authentication - use environment variables
  username: "${NTRIP_USERNAME}"
  password: "${NTRIP_PASSWORD}"

  # GGA position reporting (required by most VRS networks)
  send_gga: true
  gga_interval_secs: 10

  connection:
    timeout_secs: 10
    reconnect: true
    initial_delay_secs: 1
    max_delay_secs: 60
    backoff_reset_secs: 3600
