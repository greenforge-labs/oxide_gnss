# oxide_gnss configuration: RTK Rover with Radio/Serial Corrections
#
# RTK rover receiving corrections via radio or serial link on UART2.
# Use this for remote areas without network connectivity.

mode: rover_radio

features:
  high_precision: true    # Use HP position in ~/fix topic
  integrity: true         # Enable integrity monitoring
  satellites: false       # Disable to reduce bandwidth

device:
  port: "/dev/gnss_f9p_rover"
  baud_rate: 460800
  frame: ENU

  navigation:
    rate_hz: 5
    min_satellites: 4
    max_hdop: 5.0
    max_pdop: 10.0

  reconnect:
    enabled: true
    initial_delay_secs: 1
    max_delay_secs: 30
    max_attempts: 0       # 0 = unlimited

  # u-blox configuration overrides (mode handles ports/protocols automatically)
  ublox:
    family: "F9P"

    # 5 Hz is the sustainable rate on ZED-F9P when all four constellations,
    # dual-band, full integrity messages, and RTCM corrections are active.
    # Narrow `signals` below (or drop features) to hit 10 Hz+ on this board.
    # See docs/CONFIGURATION.md -> "Navigation rate vs constellations".
    rate:
      measurement_ms: 200   # 5 Hz
      nav_ratio: 1

    # Navigation engine configuration
    nav_spg:
      dynamic_model: automotive   # Ground vehicle dynamics
      elevation_mask: 10          # Reject low satellites (multipath reduction)

    # UART2 baudrate for receiving RTCM from radio
    ports:
      uart2:
        baudrate: 115200    # Common radio baud rate

    # GNSS constellation configuration
    signals:
      gps:
        enabled: true
        l1: true
        l2: true

      glonass:
        enabled: true
        l1: true
        l2: true

      galileo:
        enabled: false

      beidou:
        enabled: true
        b1: true
        b2: true

      sbas:
        enabled: false

      qzss:
        enabled: false

# ROS topic publish rates
ros:
  rates:
    diagnostics_hz: 1.0
    integrity_hz: 1.0

# Integrity monitoring thresholds
integrity:
  thresholds:
    min_satellites_critical: 4
    min_satellites_high: 6
    max_h_accuracy_m: 0.10
    max_v_accuracy_m: 0.15
    max_pdop: 3.0
    max_correction_age_s: 10.0
    min_cno_degraded: 25
    min_mean_cno_degraded: 35.0
    max_pvt_age_s: 2.0
    operational_threshold: 1

# No NTRIP - corrections come from radio/serial on UART2
