# oxide_gnss default configuration
# Copy this file and customize for your setup

# =============================================================================
# ROS Configuration
# =============================================================================
ros:
  # Topic publish rates (Hz)
  # Most topics publish when UBX data arrives - see messages section below.
  # These rates are for topics that aggregate multiple sources or are timer-based.
  rates:
    diagnostics_hz: 1.0     # /diagnostics - aggregated system status
    integrity_hz: 1.0       # ~/integrity, ~/operational - integrity status

# =============================================================================
# GNSS Device Configuration
# =============================================================================
device:
  # Serial port path
  # Linux: /dev/ttyACM0, /dev/ttyUSB0, or symlink from udev rule
  # Windows: COM3, COM4, etc.
  port: "/dev/gnss_f9p_rover"

  # Baud rate (ZED-F9P default is 38400, but 460800 recommended for high rate)
  baud_rate: 460800

  # Coordinate frame for velocity output
  # ENU: East-North-Up (ROS convention)
  # NED: North-East-Down (aviation/marine convention)
  frame: ENU

  # Navigation settings
  navigation:
    rate_hz: 10           # Update rate in Hz (1-25 for ZED-F9P)
    min_satellites: 4     # Minimum satellites for valid fix
    max_hdop: 5.0         # Maximum acceptable HDOP (warning threshold)
    max_pdop: 10.0        # Maximum acceptable PDOP (warning threshold)

  # Reconnection behavior
  reconnect:
    enabled: true
    initial_delay_secs: 1
    max_delay_secs: 30
    max_attempts: 0       # 0 = unlimited

  # ---------------------------------------------------------------------------
  # u-blox Receiver Configuration
  # ---------------------------------------------------------------------------
  # Structured configuration for u-blox receivers.
  # See: https://content.u-blox.com/sites/default/files/documents/u-blox-F9-HPG-1.32_InterfaceDescription_UBX-22008968.pdf
  ublox:
    # Device family - used for validation warnings
    # Supported: F9P, F9R, F9H
    family: "F9P"

    # -------------------------------------------------------------------------
    # Measurement/Navigation Rate
    # -------------------------------------------------------------------------
    rate:
      measurement_ms: 100   # Measurement rate in ms (100 = 10 Hz)
      nav_ratio: 1          # Nav solutions per measurement (typically 1)

    # -------------------------------------------------------------------------
    # Protocol Settings
    # -------------------------------------------------------------------------
    # Enable/disable protocols per port
    # Available protocols: ubx, nmea, rtcm3x
    protocols:
      usb_in: [ubx, rtcm3x]   # Accept UBX commands and RTCM corrections
      usb_out: [ubx]          # Output UBX messages only (no NMEA)
      # uart1_in: [ubx, rtcm3x]
      # uart1_out: [ubx]

    # -------------------------------------------------------------------------
    # UBX Message Output Rates
    # -------------------------------------------------------------------------
    # Rate values: 0 = disabled, 1 = every solution, N = every Nth solution
    #
    # UBX Message → ROS Topic Mapping:
    # ┌─────────────────┬────────────────────────────────────────────────────┐
    # │ UBX Message     │ ROS Topics Published                               │
    # ├─────────────────┼────────────────────────────────────────────────────┤
    # │ NAV_PVT         │ ~/fix, ~/velocity, ~/time_reference                │
    # │ NAV_HPPOSLLH    │ ~/hp_pos                                           │
    # │ NAV_SAT         │ ~/satellites                                       │
    # │ SEC_SIG         │ ~/sec_sig_details                                  │
    # │ MON_RF/COMMS    │ (data aggregated into ~/integrity)                 │
    # └─────────────────┴────────────────────────────────────────────────────┘
    #
    # Note: ~/integrity and ~/operational are rate-limited by ros.rates.integrity_hz
    #       ~/diagnostics is rate-limited by ros.rates.diagnostics_hz
    #
    # Message categories:
    #   ESSENTIAL:    NAV_PVT (required for ~/fix, ~/velocity)
    #   RECOMMENDED:  NAV_HPPOSLLH, MON_RF, MON_COMMS, SEC_SIG (for integrity)
    #   OPTIONAL:     NAV_SAT (satellite info), SEC_SIGLOG (security events)
    #
    messages:
      usb:
        # Essential - position/velocity/time
        NAV_PVT: 1            # Position, velocity, time solution

        # Recommended - high precision and integrity
        NAV_HPPOSLLH: 1       # High-precision position (for ~/hp_pos)
        NAV_POSECEF: 1        # ECEF position (for coordinate transforms)
        MON_RF: 1             # RF/antenna status, jamming indicator
        MON_COMMS: 1          # Communication port diagnostics
        SEC_SIG: 1            # Jamming/spoofing detection

        # Optional - additional data
        NAV_SAT: 5            # Satellite info (every 5th - reduces bandwidth)
        SEC_SIGLOG: 1         # Security event log

# NTRIP Client Configuration (optional)
# Comment out this section to disable NTRIP
ntrip:
  # NTRIP caster hostname
  host: "ntrip.data.gnss.ga.gov.au"

  # NTRIP caster port (standard is 2101 for HTTP, 443 for HTTPS)
  port: 2101

  # Use HTTPS for connection (false=HTTP, true=HTTPS)
  use_https: false

  # Mountpoint name (check caster sourcetable for available mounts)
  mountpoint: "SWTC00AUS0"

  # Authentication (if required by caster)
  username: "${NTRIP_USERNAME}"
  password: "${NTRIP_PASSWORD}"

  # Send GGA position to caster (required by most VRS networks)
  send_gga: true
  gga_interval_secs: 10

  # Connection settings
  connection:
    timeout_secs: 10
    reconnect: true
    initial_delay_secs: 1
    max_delay_secs: 60
    backoff_reset_secs: 3600  # reset after 1 hour of clean streaming
