name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast format check (runs on native runner, no Docker needed)
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Multi-distro build with ROS2 (uses pre-built Docker images)
  build:
    name: Build & Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO: Re-enable humble, kilted after running docker-ci-image.yml workflow
        distro: [jazzy]
        include:
          - distro: humble
            ros_distro: humble
          - distro: jazzy
            ros_distro: jazzy
          - distro: kilted
            ros_distro: kilted
    container:
      image: ghcr.io/gsokoll/oxide_gnss-ci:${{ matrix.distro }}
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/oxide_gnss_repo

      - name: Build with colcon
        shell: bash
        run: |
          # Source ROS2 and ros2-rust workspace
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source /opt/ros2_ws/install/setup.bash
          
          # Copy the .cargo/config.toml from ros2-rust workspace to use the patches
          mkdir -p .cargo
          cp /opt/ros2_ws/.cargo/config.toml .cargo/ 2>/dev/null || true
          
          # Reorganize for colcon: driver in oxide_gnss/, messages in oxide_gnss_msgs/
          mv src/oxide_gnss_repo src/oxide_gnss
          mv src/oxide_gnss/oxide_gnss_msgs src/
          
          # Build messages first, then the driver
          colcon build --packages-select oxide_gnss_msgs oxide_gnss

      - name: Run clippy
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source /opt/ros2_ws/install/setup.bash
          source install/setup.bash
          cd src/oxide_gnss
          cargo clippy --features ros2 -- -D warnings

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source /opt/ros2_ws/install/setup.bash
          source install/setup.bash
          cd src/oxide_gnss
          cargo test --features ros2

  # Optional: Test on rolling (allowed to fail)
  build-rolling:
    name: Build & Test (rolling)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/gsokoll/oxide_gnss-ci:rolling
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src/oxide_gnss_repo

      - name: Build with colcon
        shell: bash
        run: |
          source /opt/ros/rolling/setup.bash
          source /opt/ros2_ws/install/setup.bash
          mkdir -p .cargo
          cp /opt/ros2_ws/.cargo/config.toml .cargo/ 2>/dev/null || true
          mv src/oxide_gnss_repo src/oxide_gnss
          mv src/oxide_gnss/oxide_gnss_msgs src/
          colcon build --packages-select oxide_gnss_msgs oxide_gnss

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/rolling/setup.bash
          source /opt/ros2_ws/install/setup.bash
          source install/setup.bash
          cd src/oxide_gnss
          cargo test --features ros2 || true
